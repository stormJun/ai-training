[project]
name = "week04-langgraph-demo"
version = "0.1.0"
description = "Runnable LangGraph master/subagent demo with local FastAPI services."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.0",
    "pydantic>=2.9.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"week04_langgraph_demo" = ["data/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
